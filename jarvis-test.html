<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adsopify AI — Sesli Asistan Test</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#02040e;
  --surface:#070d1c;
  --border:rgba(0,200,255,0.12);
  --accent:#00c8ff;
  --accent2:#0a4a7a;
  --text:#c8e8ff;
  --text2:#4a7a9a;
  --green:#00ffaa;
  --red:#ff2244;
  --gold:#ffd060;
  --font:'Space Grotesk',sans-serif;
  --mono:'Space Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:0;padding:24px;overflow:hidden}

/* ORB */
#orb-wrap{position:relative;width:220px;height:220px;margin-bottom:32px;flex-shrink:0}
#orb-canvas{position:absolute;inset:0;width:100%;height:100%}

/* DURUM */
#status-text{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-bottom:8px;text-align:center;min-height:18px;transition:color .3s}
#status-text.listening{color:var(--green)}
#status-text.speaking{color:var(--accent)}
#status-text.thinking{color:var(--gold)}
#status-text.error{color:var(--red)}

/* LOG */
#log{width:100%;max-width:520px;height:200px;overflow-y:auto;background:rgba(3,12,30,0.8);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
#log::-webkit-scrollbar{width:3px}
#log::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:99px}
.msg{font-size:13px;line-height:1.6;padding:8px 12px;border-radius:9px}
.msg.user{background:rgba(0,200,255,0.08);color:var(--text);border-left:2px solid var(--accent);align-self:flex-end}
.msg.ai{background:rgba(0,255,170,0.06);color:var(--text);border-left:2px solid var(--green)}
.msg.sys{color:var(--text2);font-size:11px;font-family:var(--mono);padding:4px 0}

/* BUTON */
#mic-btn{
  width:72px;height:72px;border-radius:50%;
  background:transparent;
  border:2px solid var(--accent);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  position:relative;
  outline:none;
}
#mic-btn:hover{border-color:var(--green);box-shadow:0 0 24px rgba(0,255,170,0.2)}
#mic-btn.active{border-color:var(--red);box-shadow:0 0 32px rgba(255,34,68,0.35);animation:pulse-ring 1.2s ease-in-out infinite}
#mic-btn svg{width:28px;height:28px;color:var(--accent);transition:color .2s}
#mic-btn.active svg{color:var(--red)}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 32px rgba(255,34,68,0.35)}50%{box-shadow:0 0 48px rgba(255,34,68,0.6)}}

#mic-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-top:10px;text-align:center}

/* API KEY input */
#api-section{width:100%;max-width:520px;margin-bottom:20px;display:flex;gap:8px}
#api-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none}
#api-input:focus{border-color:var(--accent)}
#api-input::placeholder{color:var(--text2)}
#api-save{background:var(--accent2);border:1px solid var(--accent);border-radius:9px;padding:10px 16px;color:var(--accent);font-family:var(--mono);font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s}
#api-save:hover{background:rgba(0,200,255,0.15)}

/* Header */
.hdr{text-align:center;margin-bottom:28px}
.hdr-title{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-family:var(--mono)}
.hdr-sub{font-size:12px;color:var(--text2)}

/* Particle canvas */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="content">
  <div class="hdr">
    <div class="hdr-title">◈ Adsopify AI Asistan ◈</div>
    <div class="hdr-sub">Gemini API key'ini gir, mikrofona bas ve konuş</div>
  </div>

  <div id="api-section">
    <input id="api-input" type="password" placeholder="Gemini API Key gir (AIza...)" />
    <button id="api-save" onclick="saveKey()">Kaydet</button>
  </div>

  <div id="orb-wrap">
    <canvas id="orb-canvas" width="220" height="220"></canvas>
  </div>

  <div id="status-text">Hazır · Konuşmak için mikrofona bas</div>

  <div id="log">
    <div class="msg sys">◈ SYS: Asistan başlatıldı. Gemini API key gir ve mikrofona bas.</div>
  </div>

  <button id="mic-btn" onclick="toggleMic()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M5 10a7 7 0 0 0 14 0"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="9" y1="22" x2="15" y2="22"/>
    </svg>
  </button>
  <div id="mic-label">Mikrofon kapalı</div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let STATE = 'idle'; // idle, listening, thinking, speaking
let apiKey = localStorage.getItem('adsopify_gemini_key') || '';
let recognition = null;
let synth = window.speechSynthesis;
let isListening = false;
let orbTick = 0;
let orbScale = 1.0;
let orbTargetScale = 1.0;
let orbHalo = 40;
let orbTargetHalo = 40;
let particles = [];

// ── API Key ────────────────────────────────────────────────────────────────
if (apiKey) document.getElementById('api-input').value = '••••••••';

function saveKey() {
  const val = document.getElementById('api-input').value.trim();
  if (!val || val === '••••••••') return;
  apiKey = val;
  localStorage.setItem('adsopify_gemini_key', val);
  document.getElementById('api-input').value = '••••••••';
  addLog('sys', '✓ API key kaydedildi.');
}

// ── Log ────────────────────────────────────────────────────────────────────
function addLog(type, text) {
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ── Status ─────────────────────────────────────────────────────────────────
function setStatus(state, text) {
  STATE = state;
  const el = document.getElementById('status-text');
  el.className = state;
  el.textContent = text;

  if (state === 'listening') { orbTargetScale = 1.18; orbTargetHalo = 200; }
  else if (state === 'thinking') { orbTargetScale = 0.9; orbTargetHalo = 120; }
  else if (state === 'speaking') { orbTargetScale = 1.10; orbTargetHalo = 180; }
  else { orbTargetScale = 0.85; orbTargetHalo = 40; }
}

// ── Gemini API ─────────────────────────────────────────────────────────────
async function askGemini(userText) {
  if (!apiKey) {
    addLog('sys', '⚠ Gemini API key girilmedi.');
    setStatus('idle', 'API key eksik');
    return;
  }

  setStatus('thinking', 'Düşünüyor...');

  const systemPrompt = `Sen Adsopify'ın AI asistanısın. Adsopify bir Meta Ads yönetim platformu.
Kullanıcının reklam kampanyaları, ROAS, CTR, bütçe optimizasyonu konularında yardımcı oluyorsun.
Türkçe konuş. Kısa ve net cevaplar ver — maksimum 2-3 cümle. Samimi ve profesyonel ol.
Reklam, pazarlama ve e-ticaret konularında uzmansın.`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userText }] }],
        generationConfig: { maxOutputTokens: 200, temperature: 0.8 }
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Cevap alınamadı.';
    addLog('ai', '◈ ' + reply);
    speak(reply);
  } catch(e) {
    addLog('sys', '⚠ Hata: ' + e.message);
    setStatus('error', 'Bağlantı hatası');
    setTimeout(() => setStatus('idle', 'Tekrar dene'), 2000);
  }
}

// ── Text-to-Speech ─────────────────────────────────────────────────────────
function speak(text) {
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'tr-TR';
  utt.rate = 1.05;
  utt.pitch = 1.0;

  // Türkçe ses bul
  const voices = synth.getVoices();
  const trVoice = voices.find(v => v.lang.startsWith('tr'));
  if (trVoice) utt.voice = trVoice;

  utt.onstart = () => setStatus('speaking', 'Konuşuyor...');
  utt.onend = () => {
    setStatus('idle', 'Hazır · Konuşmak için mikrofona bas');
    if (isListening) startListening();
  };
  utt.onerror = () => setStatus('idle', 'Hazır');

  synth.speak(utt);
}

// ── Speech Recognition ─────────────────────────────────────────────────────
function toggleMic() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addLog('sys', '⚠ Tarayıcın ses tanımayı desteklemiyor. Chrome kullan.');
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'tr-TR';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    document.getElementById('mic-btn').classList.add('active');
    document.getElementById('mic-label').textContent = 'Dinliyor...';
    setStatus('listening', 'Dinliyor... Konuş');
  };

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    addLog('user', '▸ ' + text);
    stopListening();
    askGemini(text);
  };

  recognition.onerror = (e) => {
    addLog('sys', '⚠ Ses hatası: ' + e.error);
    stopListening();
    setStatus('idle', 'Tekrar dene');
  };

  recognition.onend = () => {
    if (isListening && STATE === 'listening') {
      stopListening();
      setStatus('idle', 'Hazır · Konuşmak için mikrofona bas');
    }
  };

  synth.cancel();
  recognition.start();
}

function stopListening() {
  isListening = false;
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  document.getElementById('mic-btn').classList.remove('active');
  document.getElementById('mic-label').textContent = 'Mikrofon kapalı';
}

// ── Orb Canvas ─────────────────────────────────────────────────────────────
const orbCanvas = document.getElementById('orb-canvas');
const orbCtx = orbCanvas.getContext('2d');

const ORB_COLORS = {
  idle:      [0, 200, 255],
  listening: [255, 34, 68],
  thinking:  [255, 208, 96],
  speaking:  [0, 255, 170],
  error:     [255, 34, 68],
};

// Orb partiküller
const orbParticles = Array.from({length: 80}, () => ({
  angle: Math.random() * Math.PI * 2,
  orbit: Math.random() * 0.9 + 0.1,
  speed: (Math.random() - 0.5) * 0.04,
  size: Math.random() * 2.5 + 0.5,
  phase: Math.random() * Math.PI * 2,
}));

const shellParticles = Array.from({length: 50}, () => ({
  angle: Math.random() * Math.PI * 2,
  speed: (Math.random() - 0.5) * 0.025,
  size: Math.random() * 3 + 1,
  phase: Math.random() * Math.PI * 2,
  glow: Math.random(),
}));

let ringSpins = [0, 45, 90, 200];

function hexRgb(r,g,b,a) {
  const f = Math.max(0,Math.min(255,Math.round(a)))/255;
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

function drawOrb() {
  const c = orbCtx;
  const W = 220, H = 220, cx = 110, cy = 110;
  c.clearRect(0, 0, W, H);

  const t = orbTick;
  const [R, G, B] = ORB_COLORS[STATE] || ORB_COLORS.idle;
  const fieldR = 80 * orbScale;
  const innerR = 56 * orbScale;

  // Halo
  for (let i = 6; i > 0; i--) {
    const r = fieldR + i * 6;
    const a = orbHalo * 0.06 * i;
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI * 2);
    c.fillStyle = hexRgb(R, G, B, a);
    c.fill();
  }

  // Dış halkalar
  [[1.0, 2, 0.35], [0.88, 1.5, 0.22], [0.74, 1, 0.14]].forEach(([frac, w, am]) => {
    const r = fieldR * frac;
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI * 2);
    c.strokeStyle = hexRgb(R, G, B, orbHalo * am);
    c.lineWidth = w;
    c.stroke();
  });

  // Shell partiküller
  shellParticles.forEach((p, i) => {
    const angle = p.angle + t * p.speed;
    const x = cx + Math.cos(angle) * fieldR * 0.94;
    const y = cy + Math.sin(angle) * fieldR * 0.94;
    const a = (70 + 120 * p.glow) * (STATE === 'idle' ? 0.4 : 0.8);
    c.beginPath();
    c.arc(x, y, p.size, 0, Math.PI * 2);
    c.fillStyle = hexRgb(R, G, B, a);
    c.fill();
  });

  // Dönen arcler
  ringSpins[0] = (ringSpins[0] + (STATE === 'speaking' ? 2.5 : STATE === 'listening' ? 3.5 : 0.8)) % 360;
  ringSpins[2] = (ringSpins[2] + (STATE === 'speaking' ? 1.8 : STATE === 'listening' ? 2.5 : 0.5)) % 360;
  [[ringSpins[0], 55, 80, 3], [(ringSpins[0]+140)%360, 28, 80, 2],
   [ringSpins[2], 70, 80, 3], [(ringSpins[2]+200)%360, 22, 80, 2]].forEach(([start, extent, baseR, w]) => {
    const r = baseR * orbScale * (w === 3 ? 1.0 : 0.82);
    const s = start * Math.PI / 180;
    const e = (start + extent) * Math.PI / 180;
    c.beginPath();
    c.arc(cx, cy, r, s, e);
    c.strokeStyle = hexRgb(R, G, B, orbHalo * (w === 3 ? 1.2 : 0.7));
    c.lineWidth = w;
    c.stroke();
  });

  // İç partiküller
  const activity = STATE === 'idle' ? 0.25 : STATE === 'thinking' ? 0.65 : 1.0;
  orbParticles.forEach(p => {
    const angle = p.angle + t * p.speed * (STATE === 'speaking' ? 3.0 : STATE === 'listening' ? 2.5 : 1.2);
    const wobble = 1.0 + 0.25 * Math.sin(t * 0.05 + p.phase);
    const r = innerR * p.orbit * wobble;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r * 0.65;
    const a = (20 + 160 * p.orbit) * (0.3 + activity * 0.8);
    c.beginPath();
    c.arc(x, y, p.size, 0, Math.PI * 2);
    c.fillStyle = hexRgb(R, G, B, a);
    c.fill();
  });

  // Merkez void
  c.beginPath();
  c.arc(cx, cy, innerR * 0.15, 0, Math.PI * 2);
  c.fillStyle = '#02040e';
  c.fill();

  orbTick++;
  orbScale += (orbTargetScale - orbScale) * 0.15;
  orbHalo  += (orbTargetHalo  - orbHalo)  * 0.15;
}

// ── BG Canvas (partiküller) ────────────────────────────────────────────────
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let bgParticles = [];

function initBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  bgParticles = Array.from({length: 30}, () => ({
    x: Math.random() * bgCanvas.width,
    y: Math.random() * bgCanvas.height,
    vx: (Math.random() - 0.5) * 0.2,
    vy: (Math.random() - 0.5) * 0.2,
    r: Math.random() * 1.5 + 0.3,
    a: Math.random() * 50 + 10,
  }));
}

function drawBg() {
  const c = bgCtx;
  c.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  bgParticles.forEach(p => {
    p.x = (p.x + p.vx + bgCanvas.width) % bgCanvas.width;
    p.y = (p.y + p.vy + bgCanvas.height) % bgCanvas.height;
    c.beginPath();
    c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    c.fillStyle = `rgba(0,200,255,${p.a/255})`;
    c.fill();
  });
}

window.addEventListener('resize', initBg);
initBg();

// ── Ana döngü ──────────────────────────────────────────────────────────────
function loop() {
  drawOrb();
  drawBg();
  requestAnimationFrame(loop);
}
loop();

// Sesleri yükle
window.speechSynthesis.onvoiceschanged = () => {};
setTimeout(() => { speechSynthesis.getVoices(); }, 500);
</script>
</body>
</html>
